; PlatformIO Project Configuration — Boom Barrier relay test firmware
; Build: `make` (or `pio run`).  Upload: `make upload`.  Monitor: `make monitor`.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

; Serial port. Override on the command line, e.g.:
;   pio run -t upload --upload-port COM6        (Windows)
;   pio run -t upload --upload-port /dev/ttyUSB0 (Linux)
; The Makefile sets a sensible per-OS default for you.

lib_deps =
    ; WiFi / WebServer ship with the arduino-esp32 core — no extra deps.

; ── Component test builds ────────────────────────────────────────────
; Each env below flashes ONE component in isolation (see COMPONENT TESTS
; in the Makefile). They reuse everything from [env:esp32dev] and only
; add a -DTEST_<name> flag, which selects the matching test code in
; src/main.cpp. Run them with:  make test-relay / test-gate1 / test-gate2
;
; To add a component: copy this block, rename it, and change the -D flag.
[env:relay]
extends = env:esp32dev
build_flags = -DTEST_relay
