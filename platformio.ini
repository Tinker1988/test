; PlatformIO Project Configuration — Boom Barrier relay test firmware
; Build: `make` (or `pio run`).  Upload: `make upload`.  Monitor: `make monitor`.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

; Serial port. Override on the command line, e.g.:
;   pio run -t upload --upload-port COM6        (Windows)
;   pio run -t upload --upload-port /dev/ttyUSB0 (Linux)
; The Makefile sets a sensible per-OS default for you.

lib_deps =
    ; WiFi / WebServer ship with the arduino-esp32 core — no extra deps.
